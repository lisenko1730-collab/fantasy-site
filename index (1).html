<style>
:root{--bg:#fffaf6;--card:#fff;--ink:#2a2b30;--mut:#6b6f76;--a:#f26f1f;--a2:#d95a0c;--line:#f0e2d4;--r:18px;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand img{height:58px;width:auto;mix-blend-mode:multiply}
.brand b{font-size:26px;font-weight:900;letter-spacing:1px}.brand b i{color:var(--a);font-style:normal}
nav{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;max-width:100%}
nav a{color:var(--mut);text-decoration:none;padding:7px 12px;border-radius:10px;font-size:15px}
nav a.on{background:var(--a);color:#fff}
.btn{display:inline-block;background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;border:0;border-radius:14px;padding:13px 24px;font-family:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer}
.btn.s{padding:9px 16px;font-size:14px;border-radius:12px}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.g{background:#fff;color:var(--a2);border:1px solid var(--a)}
.page{display:none;padding-bottom:40px}.page.show{display:block}
.back{display:inline-block;color:var(--mut);text-decoration:none;margin:18px 0 0}
.hero{padding:36px 0 22px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0 0 14px}h1 span{color:var(--a)}
h2{font-size:clamp(28px,4.5vw,42px);margin:18px 0 8px}
h3.sec{font-size:24px;margin:30px 0 4px}
.lead{color:var(--mut);font-size:18px;margin:0 0 20px;max-width:660px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 10px}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mos img{width:100%;aspect-ratio:1.5/1;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0 30px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--a)}
.tile img{width:100%;height:110px;object-fit:cover;border-radius:12px;display:block;margin-bottom:8px}
.tile b{display:block;padding-right:34px}.tile small{display:block;color:var(--mut);font-size:12px;padding-right:34px}
.tile .go{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 8px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;color:var(--mut)}
.step b{display:flex;align-items:center;gap:8px;color:var(--ink);margin-bottom:4px}
.step b i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--a);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;aspect-ratio:2.6/1;object-fit:cover;border-radius:12px;display:block}
.card h3{margin:6px 0 0;font-size:18px}.card p{margin:0;color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.wide{width:100%;max-width:520px;border-radius:18px;border:1px solid var(--line);margin:0 0 16px;display:block}
.note{color:var(--mut);font-size:13px}
.hl{width:100%;max-width:440px;margin:0 auto;display:block;mix-blend-mode:multiply}
footer{border-top:1px solid var(--line);padding:20px 0 28px;color:var(--mut);font-size:13px;text-align:center}
#sel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:15;box-shadow:0 -4px 16px rgba(0,0,0,.08);gap:10px;align-items:center;flex-wrap:wrap}
#sel.show{display:flex}#sel span{flex:1;min-width:160px;font-size:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;display:none;max-width:90%;text-align:center;font-size:14px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr 1fr}.brand b{font-size:22px}}
</style>
</head>

var cs=["Все","Подарки","Дом и офис","Детям"];
return '<a class="back" href="#home">← На главную</a><h2>3D печать на заказ</h2><p class="lead">Сделаем деталь, корпус, подарок или сувенир по вашему фото, эскизу или образцу. Разные размеры, цвета и материалы.</p><div class="steps">'+st.map(function(s,i){return '<div class="step"><b><i>'+(i+1)+'</i></b>'+s+'</div>'}).join("")+'</div><div class="cta">'+pair("Хочу заказать 3D печать по своей идее или фото.","Заказать по своей идее")+'</div><h3 class="sec">Что можно заказать</h3><div class="grid">'+CUSTOM.map(function(c){return '<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p><div class="row"><span class="price">по запросу</span>'+pair("Хочу заказать 3D печать: "+c[0],"Заказать").replace(/<button class="btn s g".*?<\/button>/,"")+'</div></div>'}).join("")+'</div><h3 class="sec">Готовые изделия</h3><div class="chips" id="cats">'+cs.map(function(c){return '<button class="chip'+(c===CAT?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join("")+'</div><div class="grid" id="toys"></div><p class="note">Цены на готовые изделия ориентировочные, индивидуальные заказы считаем после обсуждения.</p>'}
function toys(){
$("toys").innerHTML=TOYS.filter(function(t){return CAT==="Все"||t[4]===CAT}).map(function(t){return '<div class="card"><img data-i="'+t[3]+'" alt=""><h3>'+t[0]+'</h3><p>'+t[1]+'</p><div class="row"><span class="price">'+fmt(t[2])+'</span><button class="btn s" data-ch="max" data-order="Хочу заказать 3D печать: '+t[0]+'">Заказать</button></div></div>'}).join("");fill()}
function mags(){
return '<a class="back" href="#home">← На главную</a><h2>Персональные журналы на заказ</h2><p class="lead">Журнал к празднику или событию, где героями станут вы и ваши близкие. Отметьте темы, можно несколько, и нажмите «Заказать в MAX». Фотографии для журнала пришлёте в чате.</p>'+JG.map(function(g){return '<h3 class="sec">'+g[0]+'</h3><div class="grid">'+g[1].map(function(t){var on=SEL.indexOf(t[0])>=0;return '<div class="card"><img data-i="'+t[1]+'" alt=""><h3>'+t[0]+'</h3><div class="row"><span></span><button class="chip'+(on?' on':'')+'" data-th="'+t[0]+'">'+(on?'Выбрано ✓':'Выбрать')+'</button></div></div>'}).join("")+'</div>'}).join("")}
function china(){
var L=function(m){return '<button class="btn" data-ch="max2" data-order="'+m+'">Узнать наличие в MAX</button>'};
var st=["Напишите, что вам нужно","Уточним наличие и цену","Согласуем заказ и оплату","Привезём и передадим"];
return '<a class="back" href="#home">← На главную</a><h2>Игрушки и товары из Китая</h2><p class="lead">Ассортимент меняется: то, что есть сегодня, через неделю может закончиться. Поэтому сначала обсуждаем: напишите, что вам нужно, и мы подберём варианты, назовём цену и срок.</p><img class="wide" data-i="tchina" alt=""><div class="steps">'+st.map(function(x,i){return '<div class="step"><b><i>'+(i+1)+'</i></b>'+x+'</div>'}).join("")+'</div><div class="grid"><div class="card"><h3>Игрушки</h3><p>Конструкторы, радиоуправляемые машинки, мягкие игрушки, наборы для творчества. Что есть сейчас, уточняйте.</p><div class="row"><span></span>'+L("Хочу узнать наличие игрушек из Китая")+'</div></div><div class="card"><h3>Другие товары</h3><p>Подберём товар у проверенных поставщиков, посчитаем цену и организуем доставку.</p><div class="row"><span></span>'+L("Хочу заказать товар из Китая. Что нужно найти:")+'</div></div></div><p class="note">Постоянного каталога и цен нет, всё зависит от наличия.</p>'}
function soon(h){
var S=SOON[h];SC=[];
return '<a class="back" href="#home">← На главную</a><h2>'+S[0]+'</h2><p class="lead">'+S[1]+'</p><img class="wide" data-i="'+S[2]+'" alt="">'+(S[3]?'<div class="chips" id="sch">'+S[3].map(function(c){return '<button class="chip" data-sc="'+c+'">'+c+'</button>'}).join("")+'</div>':'<p class="note">Страница скоро будет готова. Пока можно написать и всё обсудить.</p>')+'<div class="cta" id="scta"></div>'}
function sctaDraw(h){var S=SOON[h];if(!$("scta"))return;$("scta").innerHTML=pair(S[4]+(SC.length?": "+SC.join(", "):""),"Обсудить в MAX")}
function fill(){[].forEach.call(document.querySelectorAll("img[data-i]"),function(i){i.src=IMG[i.dataset.i]})}
function selUpd(){var b=$("sel");if(CUR==="mags"&&SEL.length){var m="Хочу персональный журнал: "+SEL.join(", ");$("seltxt").textContent="Выбрано: "+SEL.join(", ");$("selmax").dataset.order=m;$("seltg").dataset.order=m;b.classList.add("show")}else b.classList.remove("show")}
function route(){
var h=(location.hash||"#home").slice(1);if(h!=="home"&&h!=="3d"&&h!=="mags"&&!SOON[h])h="home";CUR=h;
$("main").innerHTML=h==="home"?home():h==="3d"?p3d():h==="mags"?mags():h==="china"?china():soon(h);
if(h==="3d")toys();if(SOON[h])sctaDraw(h);fill();selUpd();
[].forEach.call(document.querySelectorAll("#nav a"),function(a){a.classList.toggle("on",a.dataset.p===h)});window.scrollTo(0,0)}
document.addEventListener("click",function(e){
var t=e.target.closest("button,a");if(!t)return;
if(t.dataset.order){order(t.dataset.order,t.dataset.ch);return}
if(t.dataset.cat){CAT=t.dataset.cat;[].forEach.call($("cats").children,function(c){c.classList.toggle("on",c===t)});toys();return}
if(t.dataset.th){var n=t.dataset.th,i=SEL.indexOf(n);if(i>=0)SEL.splice(i,1);else SEL.push(n);var on=SEL.indexOf(n)>=0;t.classList.toggle("on",on);t.textContent=on?"Выбрано ✓":"Выбрать";selUpd();return}
if(t.dataset.sc){var j=SC.indexOf(t.dataset.sc);if(j>=0)SC.splice(j,1);else SC.push(t.dataset.sc);t.classList.toggle("on");sctaDraw(CUR)}});
window.addEventListener("hashchange",route);
$("selmax").dataset.order="";$("seltg").dataset.order="";fill();route();
</script>
</body>
</html>
