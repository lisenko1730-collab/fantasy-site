<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МАСТЕРСКАЯ ИДЕЙ — 3D печать, журналы, игрушки и товары из Китая</title>
<meta name="description" content="Мастерская идей: 3D печать на заказ, персональные журналы к праздникам, игрушки и товары из Китая.">
<style>
:root{--bg:#fffaf6;--card:#fff;--ink:#2a2b30;--mut:#6b6f76;--a:#f26f1f;--a2:#d95a0c;--line:#f0e2d4;--r:18px;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand img{height:58px;width:auto;mix-blend-mode:multiply}
.brand b{font-size:26px;font-weight:900;letter-spacing:1px}.brand b i{color:var(--a);font-style:normal}
nav{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;max-width:100%}
nav a{color:var(--mut);text-decoration:none;padding:7px 12px;border-radius:10px;font-size:15px}
nav a.on{background:var(--a);color:#fff}
.btn{display:inline-block;background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;border:0;border-radius:14px;padding:13px 24px;font-family:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer}
.btn.s{padding:9px 16px;font-size:14px;border-radius:12px}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.g{background:#fff;color:var(--a2);border:1px solid var(--a)}
.page{display:none;padding-bottom:40px}.page.show{display:block}
.back{display:inline-block;color:var(--mut);text-decoration:none;margin:18px 0 0}
.hero{padding:36px 0 22px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0 0 14px}h1 span{color:var(--a)}
h2{font-size:clamp(28px,4.5vw,42px);margin:18px 0 8px}
h3.sec{font-size:24px;margin:30px 0 4px}
.lead{color:var(--mut);font-size:18px;margin:0 0 20px;max-width:660px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0 30px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--a)}
.tile img{width:100%;height:110px;object-fit:cover;border-radius:12px;display:block;margin-bottom:8px}
.tile b{display:block;padding-right:34px}.tile small{display:block;color:var(--mut);font-size:12px;padding-right:34px}
.tile .go{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 8px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;color:var(--mut)}
.step b{display:flex;align-items:center;gap:8px;color:var(--ink);margin-bottom:4px}
.step b i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--a);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;aspect-ratio:2.6/1;object-fit:cover;border-radius:12px;display:block}
.card h3{margin:6px 0 0;font-size:18px}.card p{margin:0;color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.wide{width:100%;max-width:520px;border-radius:18px;border:1px solid var(--line);margin:0 0 16px;display:block}
.note{color:var(--mut);font-size:13px}
.hl{width:100%;max-width:440px;margin:0 auto;display:block;mix-blend-mode:multiply}
footer{border-top:1px solid var(--line);padding:20px 0 28px;color:var(--mut);font-size:13px;text-align:center}
#sel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:15;box-shadow:0 -4px 16px rgba(0,0,0,.08);gap:10px;align-items:center;flex-wrap:wrap}
#sel.show{display:flex}#sel span{flex:1;min-width:160px;font-size:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;display:none;max-width:90%;text-align:center;font-size:14px}

/* Стили для блока "Что можно напечатать" */
.what-order { padding: 20px 0; }
.what-order h2 { font-size: 28px; margin-bottom: 12px; font-weight: 800; text-transform: uppercase;}
.what-order ul { list-style: none; padding: 0; margin: 0 0 12px; }
.what-order li { font-size: 20px; padding: 8px 0 8px 22px; position: relative; font-weight: 500;}
.what-order li::before { content: "•"; color: var(--a); position: absolute; left: 0; font-size: 24px; line-height: 1; top: 8px; }
.price-note { font-size: 16px; color: var(--mut); margin-bottom: 16px; }
.btn-order { display: block; text-align: center; font-size: 20px; font-weight: 700; color: #fff; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, var(--a), var(--a2)); text-decoration: none; width: 100%; border: 0; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.1);}
.btn-order:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }

@media(max-width:820px){.hero{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr 1fr}.brand b{font-size:22px}}
</style>
</head>
