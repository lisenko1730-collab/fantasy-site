return '<a class="back" href="#home">← На главную</a><h2>Игрушки и товары из Китая</h2><p class="lead">Ассортимент меняется: то, что есть сегодня, через неделю может закончиться. Поэтому сначала обсуждаем: напишите, что вам нужно, и мы подберём варианты, назовём цену и срок.</p><img class="wide" data-i="tchina" alt=""><div class="steps">'+st.map(function(x,i){return '<div class="step"><b><i>'+(i+1)+'</i></b>'+x+'</div>'}).join("")+'</div><div class="grid"><div class="card"><h3>Игрушки</h3><p>Конструкторы, радиоуправляемые машинки, мягкие игрушки, наборы для творчества. Что есть сейчас, уточняйте.</p><div class="row"><span></span>'+L("Хочу узнать наличие игрушек из Китая")+'</div></div><div class="card"><h3>Другие товары</h3><p>Подберём товар у проверенных поставщиков, посчитаем цену и организуем доставку.</p><div class="row"><span></span>'+L("Хочу заказать товар из Китая. Что нужно найти:")+'</div></div></div><p class="note">Постоянного каталога и цен нет, всё зависит от наличия.</p>'}

function soon(h){
var S=SOON[h];SC=[];
return '<a class="back" href="#home">← На главную</a><h2>'+S[0]+'</h2><p class="lead">'+S[1]+'</p><img class="wide" data-i="'+S[2]+'" alt="">'+(S[3]?'<div class="chips" id="sch">'+S[3].map(function(c){return '<button class="chip" data-sc="'+c+'">'+c+'</button>'}).join("")+'</div>':'<p class="note">Страница скоро будет готова. Пока можно написать и всё обсудить.</p>')+'<div class="cta" id="scta"></div>'}

function sctaDraw(h){var S=SOON[h];if(!$("scta"))return;$("scta").innerHTML=pair(S[4]+(SC.length?": "+SC.join(", "):""),"Обсудить в MAX")}
function fill(){[].forEach.call(document.querySelectorAll("img[data-i]"),function(i){i.src=IMG[i.dataset.i]})}
function selUpd(){var b=$("sel");if(CUR==="mags"&&SEL.length){var m="Хочу персональный журнал: "+SEL.join(", ");$("seltxt").textContent="Выбрано: "+SEL.join(", ");$("selmax").dataset.order=m;$("seltg").dataset.order=m;b.classList.add("show")}else b.classList.remove("show")}
function route(){
var h=(location.hash||"#home").slice(1);if(h!=="home"&&h!=="3d"&&h!=="mags"&&!SOON[h])h="home";CUR=h;
$("main").innerHTML=h==="home"?home():h==="3d"?p3d():h==="mags"?mags():h==="china"?china():soon(h);
if(h==="3d")toys();if(SOON[h])sctaDraw(h);fill();selUpd();
[].forEach.call(document.querySelectorAll("#nav a"),function(a){a.classList.toggle("on",a.dataset.p===h)});window.scrollTo(0,0)}
document.addEventListener("click",function(e){
var t=e.target.closest("button,a");if(!t)return;
if(t.dataset.order){order(t.dataset.order,t.dataset.ch);return}
if(t.dataset.cat){CAT=t.dataset.cat;[].forEach.call($("cats").children,function(c){c.classList.toggle("on",c===t)});toys();return}
if(t.dataset.th){var n=t.dataset.th,i=SEL.indexOf(n);if(i>=0)SEL.splice(i,1);else SEL.push(n);var on=SEL.indexOf(n)>=0;t.classList.toggle("on",on);t.textContent=on?"Выбрано ✓":"Выбрать";selUpd();return}
if(t.dataset.sc){var j=SC.indexOf(t.dataset.sc);if(j>=0)SC.splice(j,1);else SC.push(t.dataset.sc);t.classList.toggle("on");sctaDraw(CUR)}});
window.addEventListener("hashchange",route);
$("selmax").dataset.order="";$("seltg").dataset.order="";fill();route();
</script>
</body>
</html>
