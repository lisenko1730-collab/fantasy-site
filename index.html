<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МАСТЕРСКАЯ ИДЕЙ</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fffaf6;color:#2a2b30}
header{position:sticky;top:0;background:#fffaf6;border-bottom:1px solid #f0e2d4;padding:10px 0;z-index:10}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#2a2b30;margin-right:auto}
.brand b{font-size:24px;font-weight:900}
.brand b i{color:#f26f1f;font-style:normal}
nav{display:flex;gap:4px;overflow-x:auto;flex-wrap:wrap}
nav a{color:#6b6f76;text-decoration:none;padding:7px 12px;border-radius:10px;font-size:15px}
nav a.on{background:#f26f1f;color:#fff}
.btn{display:inline-block;background:linear-gradient(90deg,#f26f1f,#d95a0c);color:#fff;border:0;border-radius:14px;padding:13px 24px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn.s{padding:9px 16px;font-size:14px}
.btn.o{background:#fff;color:#2a2b30;border:1px solid #f0e2d4}
.btn.g{background:#fff;color:#d95a0c;border:1px solid #f26f1f}
h1{font-size:42px;margin:20px 0 10px}h1 span{color:#f26f1f}
h2{font-size:28px;margin:18px 0 8px}
h3.sec{font-size:22px;margin:24px 0 4px}
.lead{color:#6b6f76;font-size:17px;margin:0 0 20px;max-width:660px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid #f0e2d4;border-radius:18px;padding:14px}
.card h3{margin:6px 0 0;font-size:18px}
.card p{margin:0;color:#6b6f76;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.price{font-weight:800;font-size:19px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.step{background:#fff;border:1px solid #f0e2d4;border-radius:14px;padding:12px;font-size:14px;color:#6b6f76}
.step b{display:flex;align-items:center;gap:8px;color:#2a2b30;margin-bottom:4px}
.step b i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#f26f1f;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.back{display:inline-block;color:#6b6f76;text-decoration:none;margin:18px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{background:#fff;color:#2a2b30;border:1px solid #f0e2d4;border-radius:999px;padding:9px 18px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:#f26f1f;border-color:#f26f1f;color:#fff}
footer{border-top:1px solid #f0e2d4;padding:20px 0;color:#6b6f76;font-size:13px;text-align:center;margin-top:40px}
@media(max-width:820px){.steps{grid-template-columns:1fr 1fr}h1{font-size:28px}}
</style>
</head>
<body>
<header><div class="wrap bar">
<a class="brand" href="#home"><b>МАСТЕРСКАЯ <i>ИДЕЙ</i></b></a>
<nav id="nav">
<a href="#home" data-p="home">Главная</a>
<a href="#3d" data-p="3d">3D печать</a>
<a href="#mags" data-p="mags">Журналы</a>
<a href="#toys" data-p="toys">Игрушки</a>
<a href="#songs" data-p="songs">Песни и видео</a>
<a href="#bots" data-p="bots">Боты и ИИ</a>
<a href="#sites" data-p="sites">Сайты</a>
<a href="#china" data-p="china">Из Китая</a>
</nav>
</div></header>
<main class="wrap" id="main"></main>
<footer>© 2026 Мастерская идей</footer>
<script>
var MX="https://max.ru/u/f9LHodD0cOLSRnQBS8hQAfgowqn67cYwxynI1MWr8yv5xXbNU2ToWYbzls0";
var TG="https://t.me/yuriy100772";
var TOYS=[
["Брелок Волк","Подарки",500,"🐺","Подарки"],
["Брелок с именем","Подарки",600,"🔑","Подарки"],
["Астронавт","Подарки",800,"👨‍","Подарки"],
["Подставка под телефон","Дом и офис",700,"📱","Дом и офис"],
["Органайзер","Дом и офис",1300,"🗂️","Дом и офис"],
["Ключница","Дом",1200,"🔐","Дом и офис"],
["Домик-светильник","Интерьер",1500,"🏠","Дом и офис"],
["Ваза","Дом",1000,"🌸","Дом и офис"],
["Кашпо","Сад",900,"","Дом и офис"],
["Пенал","Детям",1200,"✏️","Детям"],
["Дракон","Детям",900,"🐉","Детям"],
["Стакан","Детям",700,"🥤","Детям"],
["Грузовик","Транспорт",2745,"🚛","Детям"],
["Машинки набор","Транспорт",730,"","Детям"],
["Радиоуправляемая","Транспорт",2310,"🏎️","Детям"]
];
var CUSTOM=[
["Деталь по образцу или фото","Заменим сломанную или потерянную деталь."],
["Корпус или футляр","Под ваше устройство или предмет."],
["Подставки и держатели","Под телефон, инструмент, мелочи."],
["Подарки с именем или фото","Брелоки, таблички, фигурки."],
["Сувениры и логотипы","Для бизнеса и мероприятий."]
];
var CAT="Все";
function $(i){return document.getElementById(i)}
function pair(msg,label){return '<button class="btn" data-order="'+msg+'">'+label+'</button><button class="btn s g" data-tg="'+msg+'">Telegram</button>'}
function fmt(n){return n.toLocaleString("ru-RU")+" ₽"}
function order(msg,tg){
if(tg){window.open(TG+"?text="+encodeURIComponent(msg),"_blank")}
else{window.open(MX,"_blank");alert("Текст заявки скопирован: "+msg)}
}
function home(){
return '<div><h1>3D печать <span>на заказ</span></h1><p class="lead">Сделаем по вашему фото, эскизу или образцу: детали, корпуса, подарки, сувениры. А ещё персональные журналы к праздникам.</p><div class="cta">'+pair("Здравствуйте! Хочу заказать 3D печать.","Заказать в MAX")+'</div></div><h3 class="sec">Наши услуги</h3><div class="grid">'+CUSTOM.map(function(c){return '<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p><div class="row"><span class="price">по запросу</span>'+pair("Хочу: "+c[0],"Заказать")+'</div></div>'}).join("")+'</div>'}
function p3d(){
var st=["Пришлите фото, эскиз или размеры","Оценим цену и срок","Напечатаем и проверим","Отправим или передадим"];
var cs=["Все","Подарки","Дом и офис","Детям"];
return '<a class="back" href="#home">← На главную</a><h2>3D печать на заказ</h2><p class="lead">Сделаем деталь, корпус, подарок или сувенир по вашему фото, эскизу или образцу.</p><div class="steps">'+st.map(function(s,i){return '<div class="step"><b><i>'+(i+1)+'</i></b>'+s+'</div>'}).join("")+'</div><div class="cta">'+pair("Хочу заказать 3D печать по своей идее.","Заказать по идее")+'</div><h3 class="sec">Готовые изделия</h3><div class="chips" id="cats">'+cs.map(function(c){return '<button class="chip'+(c===CAT?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join("")+'</div><div class="grid" id="toys"></div>'}
function toysPage(){
$("toys").innerHTML=TOYS.filter(function(t){return CAT==="Все"||t[4]===CAT}).map(function(t){return '<div class="card"><div style="font-size:48px;text-align:center">'+t[3]+'</div><h3>'+t[0]+'</h3><p>'+t[1]+'</p><div class="row"><span class="price">'+fmt(t[2])+'</span><button class="btn s" data-order="Хочу заказать: '+t[0]+'">Заказать</button></div></div>'}).join("")}
function toys(){
return '<a class="back" href="#home">← На главную</a><h2>Игрушки</h2><p class="lead">Тематические серии игрушек. Выберите категорию — и мы подберём варианты.</p><div class="steps"><div class="step"><b><i>1</i></b>Выберите тему</div><div class="step"><b><i>2</i></b>Обсудим возраст и бюджет</div><div class="step"><b><i>3</i></b>Подберём и привезём</div><div class="step"><b><i>4</i></b>Передадим вам</div></div><div class="cta">'+pair("Хочу посмотреть игрушки.","Заказать в MAX")+'</div><h3 class="sec">Каталог</h3><div class="chips" id="cats">'+["Все","Подарки","Дом и офис","Детям"].map(function(c){return '<button class="chip'+(c===CAT?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join("")+'</div><div class="grid" id="toys"></div>'}
function mags(){
return '<a class="back" href="#home">← На главную</a><h2>Персональные журналы</h2><p class="lead">Журнал к празднику или событию, где героями станут вы и ваши близкие.</p><div class="cta">'+pair("Хочу персональный журнал.","Заказать в MAX")+'</div>'}
function soon(h){
var names={songs:["Песни и видео с ИИ","Создаём песни, клипы и истории для вас, вашей семьи или ребёнка."],bots:["ИИ-боты и помощники","Умные боты для консультаций, игр, обучения и поддержки."],sites:["Сайты","Лендинг, визитка, магазин или портфолио. Быстрый запуск."],china:["Товары из Китая","Подберём товары у проверенных поставщиков."]}
var S=names[h]||["Раздел","Скоро будет готов"];
return '<a class="back" href="#home">← На главную</a><h2>'+S[0]+'</h2><p class="lead">'+S[1]+'</p><div class="cta">'+pair("Хочу узнать подробнее.","Заказать в MAX")+'</div>'}
function route(){
var h=(location.hash||"#home").slice(1);
if(h!=="home"&&h!=="3d"&&h!=="mags"&&h!=="toys"&&h!=="songs"&&h!=="bots"&&h!=="sites"&&h!=="china")h="home";
$("main").innerHTML=h==="home"?home():h==="3d"?p3d():h==="mags"?mags():h==="toys"?toys():soon(h);
if(h==="3d"||h==="toys")toysPage();
[].forEach.call(document.querySelectorAll("#nav a"),function(a){a.classList.toggle("on",a.dataset.p===h)});
window.scrollTo(0,0)}
document.addEventListener("click",function(e){
var t=e.target.closest("button,a");if(!t)return;
if(t.dataset.order){order(t.dataset.order,t.dataset.tg);return}
if(t.dataset.cat){CAT=t.dataset.cat;route();return}});
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
